<!doctype html>
<!-- data-preset chọn bộ giao diện: "xclipse" (mặc định: Ice/Navy/Coral) hoặc "lucian". Hero "Tầm nhìn Thông minh" (kính sọc dọc + quả cầu 3D) bật mặc định; thêm data-hero="plain" để dùng hero gọn. -->
<html lang="vi" data-preset="xclipse">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tên ứng dụng</title>
<meta name="description" content="Mô tả ngắn của ứng dụng (đổi ở đây và trong js/config.js).">
<meta name="theme-color" content="#F5FBFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#041226" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23072D59'/%3E%3Cpath d='M9 9l14 14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M23 9L9 23' stroke='%23FD6E88' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Áp giao diện đã chọn TRƯỚC khi vẽ để không bị nháy sáng/tối. Khoá 'ep_theme' = prefix trong js/config.js + 'theme': ĐỔI prefix thì phải đổi tay chuỗi này (new-project.sh không tự đổi). -->
<script>(function(d){try{var t=localStorage.getItem('ep_theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);}catch(e){}})(document.documentElement);</script>
<!-- Phông tự host trong fonts/ (không gọi mạng ngoài): Be Vietnam Pro (chữ giao diện, 400-800) + Playfair Display nghiêng đậm (nhấn hero). -->
<link rel="preload" href="fonts/be-vietnam-pro-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/be-vietnam-pro-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css?v=0.1.2">
<link rel="stylesheet" href="css/app.css?v=0.1.2">
<link rel="stylesheet" href="css/hero.css?v=0.1.2">
<!-- Lớp Lucian: vi tương tác cho mọi thành phần (xoá 2 dòng lucian.css + lucian.js nếu không muốn) -->
<link rel="stylesheet" href="css/lucian.css?v=0.1.2">
<link rel="stylesheet" href="css/biz.css?v=0.1.2">
<link rel="stylesheet" href="css/brand.css?v=0.1.2">
<!-- Chuẩn điện thoại (references/13-chuan-mobile.md): thanh tab dưới, bottom sheet, thanh hành động, cỡ chạm 48px. Nạp CUỐI để thắng các lớp trước. -->
<link rel="stylesheet" href="css/mobile.css?v=0.1.2">
<link rel="stylesheet" href="css/polish.css?v=0.1.2">
</head>
<body>
<a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>

<header class="topbar">
  <a class="brand" href="#/home" aria-label="Về trang Tổng quan"><span class="brand-mark" id="brand-mark" aria-hidden="true">X</span><span class="brand-name" id="brand-name">Tên ứng dụng</span></a>
  <!-- Các tab được JS dựng từ EP.register(...) -->
  <nav class="tabs" id="tabs" aria-label="Điều hướng chính (máy tính)"></nav>
  <div class="topbar-actions">
    <button type="button" class="icon-btn" id="btn-theme" data-mode="system" aria-label="Giao diện: Theo hệ thống. Bấm để đổi" title="Giao diện: Theo hệ thống">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Mỗi view là <section> có đúng một <h1> (do router dựng). -->
  <div id="views"><noscript><p>Ứng dụng cần JavaScript để chạy.</p></noscript></div>
</main>

<footer class="footer">
  <span>&copy; <span id="ft-app">Tên ứng dụng</span> · <span id="ft-version">v0.1.0</span></span>
  <span class="mock-badge" id="ft-notice" role="note"></span>
  <span class="muted" id="ft-storage" role="status"></span>
</footer>

<!-- Thanh tab dưới (chỉ hiện < 768px), JS dựng từ EP.register. -->
<nav class="bnav" id="bnav" aria-label="Điều hướng chính"></nav>

<div id="toasts" class="toasts" role="region" aria-label="Thông báo" aria-live="polite"></div>

<!-- Thứ tự nạp: config -> version -> core -> ui -> form -> charts -> export -> ai -> demo -> modules -> lucian -> features -> app -->
<script src="js/config.js?v=0.1.2"></script>
<script src="js/version.js?v=0.1.2"></script>
<script src="js/icons.js?v=0.1.2"></script>
<script src="js/core.js?v=0.1.2"></script>
<script src="js/ui.js?v=0.1.2"></script>
<script src="js/form.js?v=0.1.2"></script>
<script src="js/charts.js?v=0.1.2"></script>
<script src="js/export.js?v=0.1.2"></script>
<script src="js/ai.js?v=0.1.2"></script>
<script src="js/demo.js?v=0.1.2"></script>
<!-- Firebase tuỳ chọn: chỉ hoạt động khi EP.config.firebase.enabled = true (mặc định tắt, không gọi mạng). Phải nạp trước features. -->
<script src="js/firebase.js?v=0.1.2"></script>
<!-- Mô-đun tiện ích tuỳ chọn (xoá dòng nào không dùng) -->
<script src="js/mock.js?v=0.1.2"></script>
<script src="js/metrics.js?v=0.1.2"></script>
<script src="js/match.js?v=0.1.2"></script>
<script src="js/calc.js?v=0.1.2"></script>
<script src="js/scenario.js?v=0.1.2"></script>
<script src="js/import.js?v=0.1.2"></script>
<script src="js/checklist.js?v=0.1.2"></script>
<script src="js/quiz.js?v=0.1.2"></script>
<script src="js/chat.js?v=0.1.2"></script>
<script src="js/timeslot.js?v=0.1.2"></script>
<!-- Lớp Lucian: nạp SAU mọi mô-đun trên (nó bọc EP.ui / EP.ai) và TRƯỚC features -->
<script src="js/lucian.js?v=0.1.2"></script>
<script src="js/mobile.js?v=0.1.2"></script>
<!-- FEATURES: mỗi feature một dòng. Nhân bản features/_example -> features/<ten>/ rồi thêm dòng ở đây. -->
<script src="features/_example/feature.js?v=0.1.2"></script>
<script src="features/_playground/feature.js?v=0.1.2"></script>
<script src="js/hero.js?v=0.1.2"></script>
<script src="js/app.js?v=0.1.2"></script>
</body>
</html>
